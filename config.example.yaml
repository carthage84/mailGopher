# MailGopher configuration
# Copy to config.yaml.
#
# Secrets: do not paste passwords here. Point at files or env vars instead:
#   "file:/etc/mailgopher/yahoo.password"          # chmod 600
#   "file:${CREDENTIALS_DIRECTORY}/yahoo"          # systemd LoadCredential=
#   "env:YAHOO_IMAP_PASSWORD"

gmailAccounts:
  personal:
    email: you@gmail.com
    clientId: YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com
    clientSecret: "file:./secrets/gmail.personal.clientSecret"
    # Created by: npm run auth -- --account personal
    refreshToken: "file:./secrets/gmail.personal.refreshToken"

  secondary:
    email: other@gmail.com
    clientId: YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com
    clientSecret: "file:./secrets/gmail.secondary.clientSecret"
    refreshToken: "file:./secrets/gmail.secondary.refreshToken"

jobs:
  - id: yahoo-imap-to-personal
    enabled: true
    source:
      protocol: imap
      host: imap.mail.yahoo.com
      port: 993
      secure: true
      user: you@yahoo.com
      password: "file:./secrets/job.yahoo-imap-to-personal.password"
      folder: INBOX
      idle: true
    destination:
      gmailAccount: personal
      labels:
        - Imported/Yahoo
    options:
      intervalMinutes: 15
      leaveOnServer: true
      markAsRead: false
      deleteAfterImport: false
      maxMessagesPerRun: 100

  - id: outlook-pop3-to-secondary
    enabled: false
    source:
      protocol: pop3
      host: outlook.office365.com
      port: 995
      secure: true
      user: you@outlook.com
      password: "file:./secrets/job.outlook-pop3-to-secondary.password"
    destination:
      gmailAccount: secondary
      labels:
        - Imported/Outlook
    options:
      intervalMinutes: 30
      leaveOnServer: true
      deleteAfterImport: false
      maxMessagesPerRun: 50

settings:
  stateDir: ./data
  logLevel: info
  # true = allow inline passwords in this file (not recommended)
  allowPlaintextSecrets: false
